name = "snapit"
main = "src/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
BACKEND_URL = "https://snapit-fp69.onrender.com"

# Wake the Render backend every 2 minutes so it never goes to sleep (calls scheduled() in src/index.js)
[triggers]
crons = ["*/2 * * * *"]
